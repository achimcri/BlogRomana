# Mediul complet de dezvoltare: aplicația + baza de date.
#
#   npm run docker:up
#
# Apoi deschide http://localhost:3000
#
# Postgres rulează nativ pe Apple Silicon, deci nu mai e nevoie de emulare
# Rosetta (cum cerea imaginea SQL Server, folosită înainte de mutarea pe Neon).

services:
  postgres:
    image: postgres:17-alpine
    container_name: blogromana-postgres
    environment:
      POSTGRES_USER: blogromana
      POSTGRES_PASSWORD: LocalDev_Parola123
      # Imaginea creează baza de date la prima pornire, deci nu mai avem
      # nevoie de un pas separat de creare (cum cerea SQL Server).
      POSTGRES_DB: blogromana
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blogromana -d blogromana"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: blogromana-app
    depends_on:
      postgres:
        condition: service_healthy
    # Citim .env pentru AUTH_SECRET și credențialele Google, apoi suprascriem
    # DATABASE_URL: în rețeaua compose, gazda bazei este "postgres", nu localhost.
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://blogromana:LocalDev_Parola123@postgres:5432/blogromana"
      AUTH_URL: "http://localhost:3000"
      NODE_ENV: development
    ports:
      - "3000:3000"
    volumes:
      # Codul sursă, ca modificările să se vadă imediat.
      - .:/app
      # Volume anonime care ACOPERĂ folderele de pe gazdă: node_modules conține
      # binare compilate pentru macOS-arm64, care nu rulează în container.
      - /app/node_modules
      - /app/.next

volumes:
  postgres-data:
