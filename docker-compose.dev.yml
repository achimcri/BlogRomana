# Mediul complet de dezvoltare: aplicația + baza de date.
#
#   docker compose -f docker-compose.dev.yml up --build
#
# Apoi deschide http://localhost:3000
#
# ATENTIE (Apple Silicon): imaginea SQL Server exista doar pentru x86_64, deci
# ruleaza prin emulare. Activeaza in Docker Desktop:
#   Settings -> General -> "Use Rosetta for x86_64/amd64 emulation on Apple Silicon"

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: blogromana-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "LocalDev_Parola123"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      # /opt/mssql-tools18/ este calea din imaginea 2022; -C accepta certificatul self-signed
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: blogromana-app
    depends_on:
      sqlserver:
        condition: service_healthy
    # Citim .env pentru AUTH_SECRET si credentialele Google, apoi suprascriem
    # DATABASE_URL: in reteaua compose, gazda bazei este "sqlserver", nu localhost.
    env_file:
      - .env
    environment:
      DATABASE_URL: "sqlserver://sqlserver:1433;database=blogromana;user=sa;password=LocalDev_Parola123;encrypt=true;trustServerCertificate=true"
      AUTH_URL: "http://localhost:3000"
      NODE_ENV: development
    ports:
      - "3000:3000"
    volumes:
      # Codul sursa, ca modificarile sa se vada imediat.
      - .:/app
      # Volume anonime care ACOPERA folderele de pe gazda: node_modules contine
      # binare compilate pentru macOS-arm64, care nu ruleaza in container.
      - /app/node_modules
      - /app/.next

volumes:
  mssql-data:
